<div class="row">
<div class="span12">
	<div class="widget ">
		<div class="widget-header">
			<i class="icon-pencil"></i>
			<h3>编辑账号</h3>
		</div>

		<div class="widget-content">
			<div class="alert alert-danger hide" role="alert"></div>

			<form action="{{urlfor "UserController.Edit"}}" method="post" class="form-horizontal">
				<input type="hidden" name="id" value="{{.user.Id}}" />
				<fieldset>
					<div class="control-group">
						<label class="control-label" for="user_name">用户名</label>
						<div class="controls">
							<input type="text" class="span4 disabled" id="user_name" value="{{.user.UserName}}" disabled="">
						</div>
					</div>

					<div class="control-group">
						<label class="control-label" for="status">状态</label>
						<div class="controls">
							<select name="status" id="status" class="span2">
								<option value="0" {{if eq .user.Status 0}}selected{{end}}>正常</option>
								<option value="-1" {{if eq .user.Status -1}}selected{{end}}>禁用</option>
							</select>
						</div>
					</div>

					<div class="control-group">
						<label class="control-label">MFA</label>
						<div class="controls">
							{{if eq .user.MfaEnabled 1}}<span class="label label-success">已绑定</span>{{else}}<span class="label label-warning">未绑定</span>{{end}}
						</div>
					</div>

					<div class="control-group">
						<label class="control-label" for="password">重置密码</label>
						<div class="controls">
							<input type="password" name="password" class="span4" id="password">
							<p class="help-block">不修改密码请留空，填写时至少8位。</p>
						</div>
					</div>

					<div class="form-actions">
						<button type="submit" class="btn btn-primary">保 存</button>
						<a href="{{urlfor "UserController.List"}}" class="btn">返 回</a>
					</div>
				</fieldset>
			</form>
		</div>
	</div>
</div>
</div>

<script>
$(function () {
	$("form").submit(function () {
		$(".alert").hide();
		$("button[type='submit']").attr('disabled', true);
		$.post('{{urlfor "UserController.Edit"}}', $(this).serialize(), function (out) {
			if (out.status == 0) {
				window.location.href = '{{urlfor "UserController.List"}}';
			} else {
				$(".alert").text(out.msg);
				$(".alert").show();
				$("button[type='submit']").attr('disabled', false);
			}
		}, "json");
		return false;
	});
});
</script>
