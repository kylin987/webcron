<div class="row">
<div class="span12">
	<div class="widget ">
		<div class="widget-header">
			<i class="icon-eye-open"></i>
			<h3>操作审计</h3>
		</div>

		<div class="widget-content">
			<form method="get" action="{{urlfor "OperationLogController.List"}}" class="form-inline" style="margin-bottom: 15px;">
				<select name="user_id" class="span2">
					<option value="0">全部账号</option>
					{{range $k, $v := .users}}
					<option value="{{$v.Id}}" {{if eq $v.Id $.user_id}}selected{{end}}>{{$v.UserName}}</option>
					{{end}}
				</select>
				<select name="action" class="span2">
					<option value="">全部动作</option>
					{{range $k, $v := .actionOptions}}
					<option value="{{$v.key}}" {{if eq $v.key $.action}}selected{{end}}>{{$v.label}}</option>
					{{end}}
				</select>
				<input type="text" name="target_type" class="span1" placeholder="对象" value="{{.target_type}}">
				<input type="text" name="target_id" class="span1" placeholder="对象ID" value="{{.target_id}}">
				<select name="result" class="span1">
					<option value="">结果</option>
					<option value="0" {{if eq .result "0"}}selected{{end}}>成功</option>
					<option value="-1" {{if eq .result "-1"}}selected{{end}}>失败</option>
				</select>
				<input type="text" name="start_time" class="span2" placeholder="开始时间" value="{{.start_time}}">
				<input type="text" name="end_time" class="span2" placeholder="结束时间" value="{{.end_time}}">
				<button type="submit" class="btn btn-primary"><i class="icon-search icon-white"></i> 搜索</button>
			</form>

			<table class="table table-striped table-bordered table-hover">
				<thead>
				<tr>
					<th width="60">ID</th>
					<th class="span2">时间</th>
					<th>账号</th>
					<th>动作</th>
					<th>对象</th>
					<th>结果</th>
					<th>IP</th>
					<th>路径</th>
					<th width="70">操作</th>
				</tr>
				</thead>
				<tbody>
				{{range $k, $v := .list}}
				<tr>
					<td>{{$v.id}}</td>
					<td>{{$v.create_time}}</td>
					<td>{{$v.user_name}}</td>
					<td><span class="label label-info">{{$v.action_label}}</span></td>
					<td>{{$v.target_type}} #{{$v.target_id}}</td>
					<td>{{if eq $v.result 0}}<span class="label label-success">成功</span>{{else}}<span class="label label-important">失败</span>{{end}}</td>
					<td>{{$v.ip}}</td>
					<td>{{$v.request_path}}</td>
					<td>
						<a class="btn btn-info" href="{{urlfor "OperationLogController.View"}}?id={{$v.id}}">
							<i class="icon-search icon-white"></i> 详情
						</a>
					</td>
				</tr>
				{{end}}
				</tbody>
				<tfoot>
					<tr><td colspan="100">{{str2html .pageBar}}</td></tr>
				</tfoot>
			</table>
		</div>
	</div>
</div>
</div>
