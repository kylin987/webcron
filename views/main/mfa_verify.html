<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>MFA验证 - {{.siteName}}</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
	<link href="/static/css/bootstrap.min.css" rel="stylesheet" type="text/css" />
	<link href="/static/css/bootstrap-responsive.min.css" rel="stylesheet" type="text/css" />
	<link href="/static/css/font-awesome.css" rel="stylesheet">
	<link href="/static/css/style.css" rel="stylesheet" type="text/css">
	<link href="/static/css/pages/signin.css" rel="stylesheet" type="text/css">
</head>
<body>
<div class="navbar navbar-fixed-top">
	<div class="navbar-inner">
		<div class="container">
			<a class="brand" href="/">{{.siteName}}</a>
		</div>
	</div>
</div>

<div class="account-container">
	<div class="content clearfix">
		<form action="{{urlfor "MainController.MfaVerify"}}" method="post">
			<h1>MFA验证</h1>
			<div class="login-fields">
				<p class="text-error">{{.flash.error}}&nbsp;</p>
				<p>请输入账号 <strong>{{.user.UserName}}</strong> 的 6 位动态验证码。</p>
				<div class="field field-with-icon">
					<label for="code">动态验证码</label>
					<i class="icon-shield field-icon"></i>
					<input type="text" id="code" name="code" value="" placeholder="6位验证码" class="login code-field" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]*" maxlength="6" autofocus />
				</div>
			</div>
			<div class="login-actions">
				<button class="button btn btn-success btn-large">验 证</button>
			</div>
		</form>
	</div>
</div>

<script src="/static/js/jquery-1.7.2.min.js"></script>
<script src="/static/js/bootstrap.js"></script>
<script>
// 输入满 6 位数字后自动提交
$(function() {
	var $code = $('#code');
	$code.on('input', function() {
		var val = $code.val().replace(/\D/g, '');
		$code.val(val);
		if (val.length === 6) {
			$code.closest('form').submit();
		}
	});
});
</script>
</body>
</html>
