<div class="row">
<div class="span12">
	<div class="widget ">
		<div class="widget-header">
			<i class="icon-user"></i>
			<h3>账号列表</h3>
		</div>

		<div class="widget-content">
			<div class="btn-toolbar">
				<div class="btn-group">
					<a href="{{urlfor "UserController.Add"}}" class="btn btn-large btn-info"><span class="icon-plus"></span> 新建账号</a>
				</div>
			</div>

			<table class="table table-striped table-bordered table-hover">
				<thead>
				<tr>
					<th width="50">ID</th>
					<th>用户名</th>
					<th width="80">状态</th>
					<th width="80">MFA</th>
					<th class="span2">最后登录时间</th>
					<th>最后登录IP</th>
					<th width="220">操作</th>
				</tr>
				</thead>
				<tbody>
				{{range $k, $v := .list}}
				<tr>
					<td class="center">{{$v.id}}</td>
					<td>{{$v.user_name}}</td>
					<td>
						{{if eq $v.status 0}}<span class="label label-success">正常</span>{{else}}<span class="label label-important">禁用</span>{{end}}
					</td>
					<td>
						{{if eq $v.mfa_enabled 1}}<span class="label label-success">已绑定</span>{{else}}<span class="label label-warning">未绑定</span>{{end}}
					</td>
					<td>{{$v.last_login_text}}</td>
					<td>{{$v.last_ip}}</td>
					<td style="white-space: nowrap;">
						<a class="btn btn-info" href="{{urlfor "UserController.Edit"}}?id={{$v.id}}">
							<i class="icon-pencil icon-white"></i> 编辑
						</a>
						<a class="btn btn-warning btn-reset-mfa" href="{{urlfor "UserController.ResetMfa"}}?id={{$v.id}}">
							<i class="icon-repeat icon-white"></i> 重置MFA
						</a>
					</td>
				</tr>
				{{end}}
				</tbody>
				<tfoot>
					<tr><td colspan="100">{{str2html .pageBar}}</td></tr>
				</tfoot>
			</table>
		</div>
	</div>
</div>
</div>

<script>
$(function () {
	$(".btn-reset-mfa").click(function () {
		return confirm("确定要重置该账号的MFA吗？该用户下次登录必须重新绑定。");
	});
});
</script>
